name: run-tests

on:
  push:
    branches:
      - 2.x
  pull_request:
    branches:
      - 2.x

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
            carbon: 3.*
          - laravel: 12.*
            testbench: 10.*
            carbon: 3.*
          - laravel: 11.*
            testbench: ^9.5
            carbon: 2.*
          - laravel: 10.*
            testbench: ^8.28
            carbon: 2.*
        exclude:
          # Laravel 10: PHP ^8.1 — test 8.1, 8.2, 8.3, 8.4
          - laravel: 10.*
            php: '8.5'
          # Laravel 11: PHP ^8.2 — test 8.2, 8.3, 8.4
          - laravel: 11.*
            php: '8.1'
          - laravel: 11.*
            php: '8.5'
          # Laravel 12: PHP ^8.2 — test 8.2, 8.3, 8.4
          - laravel: 12.*
            php: '8.1'
          - laravel: 12.*
            php: '8.5'
          # Laravel 13: PHP ^8.3 — test 8.3, 8.4, 8.5
          - laravel: 13.*
            php: '8.1'
          - laravel: 13.*
            php: '8.2'

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Downgrade test tooling for PHP 8.1
        if: matrix.php == '8.1'
        shell: bash
        run: |
          composer remove pestphp/pest pestphp/pest-plugin-laravel nunomaduro/collision phpunit/phpunit --dev --no-interaction --no-update
          composer require "pestphp/pest:^1.23" "pestphp/pest-plugin-laravel:^1.4" "nunomaduro/collision:^6.4" "phpunit/phpunit:^9.6" --dev --no-interaction --no-update
          php -r "file_put_contents('phpunit.xml.dist', str_replace(['<source>', '</source>'], ['<coverage>', '</coverage>'], file_get_contents('phpunit.xml.dist')));"

      - name: Remove packages incompatible with Laravel 12+
        if: matrix.laravel == '12.*' || matrix.laravel == '13.*'
        run: |
          composer remove "larastan/larastan" "phpstan/extension-installer" "phpstan/phpstan-deprecation-rules" "phpstan/phpstan-phpunit" --dev --no-interaction --no-update

      - name: Remove packages incompatible with Laravel 13
        if: matrix.laravel == '13.*'
        run: |
          composer remove "pestphp/pest-plugin-laravel" --dev --no-interaction --no-update

      - name: Setup dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "nesbot/carbon:${{ matrix.carbon }}" --no-interaction --no-update

      - name: Install dependencies
        run: |
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-scripts

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest
